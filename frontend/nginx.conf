server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Service Worker darf nie gecacht werden, sonst propagieren App-Updates nicht.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # nginx' eingebaute mime.types kennt .mjs und .webmanifest nicht (nur
    # .wasm wurde nachträglich ergänzt) — ohne das lehnen Browser .mjs strikt
    # als Modul-Script ab ("non-JavaScript MIME type application/octet-stream").
    # default_type NUR in diesem location-Scope setzen, nicht per types{} im
    # server-Block überschreiben — das hatte im Mastplaner-Modul letztes Mal
    # die globale Zuordnung für ALLE Dateitypen (auch .html/.js) kaputtgemacht.
    location ~ \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    location ~ \.webmanifest$ {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Gebaute Dateien tragen einen Inhalts-Hash im Namen und aendern sich nie
    # — dafuer darf der Browser sie ewig behalten. Wichtiger ist das =404:
    # ohne das faellt eine Anfrage nach einem Namen aus einem AELTEREN Build
    # (den es nach dem Deploy nicht mehr gibt) unten in die SPA-Regel und
    # bekommt index.html mit Status 200 zurueck. Wer dort JavaScript oder das
    # pglite-WASM erwartet, scheitert dann an HTML — als "Failed to fetch"
    # oder MIME-Fehler, nicht als erkennbares 404. Genau das ist am 2026-09-24
    # auf einem Telefon passiert, dessen Service-Worker noch die vorige
    # Fassung hielt.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Die Huelle dagegen NIE aus dem Cache: sie nennt die gehashten Dateinamen.
    # Eine alte index.html verweist auf Dateien, die es nicht mehr gibt.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Client-seitiges Routing (react-router): alles Unbekannte auf index.html.
    location / {
        try_files $uri /index.html;
    }
}
