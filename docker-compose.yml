services:
  postgres:
    restart: unless-stopped
    # postgis/postgis statt postgres:16-alpine (Debian-basiert, gleiches
    # Postgres-16-Datenformat) — für echte PostGIS-Geometrie-Spalten in
    # modules/fields und modules/wiesenjournal, siehe core/backend/fmis_core/
    # schema/0003_postgis.sql (create extension, idempotent unabhängig davon,
    # ob dieses Image die Extension bereits selbst beim Erstinit angelegt hat).
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: fmis
      POSTGRES_PASSWORD: fmis
      POSTGRES_DB: fmis
    # Kein ports-Mapping: nur intern (im Docker-Netz) für den Backend-Container erreichbar.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fmis"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://fmis:fmis@postgres:5432/fmis
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET muss in .env gesetzt sein}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-365}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:?INITIAL_ADMIN_EMAIL muss in .env gesetzt sein}
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL muss in .env gesetzt sein, z.B. https://fmis.riedackerhof.ch}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:-fmis@localhost}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      # Wer ohne vorherige Erfassung einen Login-Link anfordern darf (Domains,
      # kommagetrennt). Alle anderen Adressen brauchen einen bestehenden
      # Eintrag in users — siehe core/backend/fmis_core/auth.py.
      LOGIN_DOMAINS: ${LOGIN_DOMAINS:-}
      # Anmeldung am vorgelagerten Portal gegen ein fmis-Token tauschen
      # (/auth/sso). NUR dort auf true setzen, wo der Router fmis-sso unten
      # tatsächlich hinter der ForwardAuth-Middleware hängt — sonst wäre der
      # Kopf Remote-Email frei erfindbar. Siehe fmis_core/auth.py.
      SSO_ENABLED: ${SSO_ENABLED:-}
      # NUR für Test-/Entwicklungsumgebungen setzen — leer lassen in Produktion!
      # Aktiviert POST /auth/password-login (Admin-Login ohne Magic-Link).
      TEST_LOGIN_PASSWORD: ${TEST_LOGIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - web-netzwerk
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-web-netzwerk}
      # Ein Backend/eine DB für ALLE Module (siehe core/backend/fmis_core) —
      # /<modul>/sync/* je aktiviertem Modul (backend/app/main.py), plus die
      # geteilten Core-Routen. Höhere Priorität als der Frontend-Router unten,
      # sonst würde z.B. /livestock/sync/push vom SPA-Catch-all verschluckt,
      # obwohl /livestock selbst (ohne /sync) eine Frontend-Route ist.
      # Jede Modul-INSTANZ (core/backend/fmis_core/module_registry.py —
      # dairy_schafe ist eine zweite Instanz von dairy!) und jeder Backend-
      # Unterpfad (sync/, reader/, reports/) muss hier explizit stehen. Nur
      # PathPrefix, kein Regex: der Server läuft Traefik v2, lokal v3, und
      # die Regex-Syntax ist zwischen beiden inkompatibel.
      - >-
        traefik.http.routers.fmis-api.rule=Host(`${DOMAIN:-fmis.riedackerhof.ch}`) &&
        (PathPrefix(`/auth`) || PathPrefix(`/core`) || PathPrefix(`/admin`) ||
        PathPrefix(`/livestock/sync`) || PathPrefix(`/livestock/reader`) ||
        PathPrefix(`/dairy/sync`) || PathPrefix(`/dairy/reader`) ||
        PathPrefix(`/dairy_schafe/sync`) || PathPrefix(`/dairy_schafe/reader`) ||
        PathPrefix(`/fields/sync`) ||
        PathPrefix(`/wiesenjournal/sync`) || PathPrefix(`/wiesenjournal/reports`) ||
        PathPrefix(`/wiesenjournal/parcels`) || PathPrefix(`/wiesenjournal/fertilization`) ||
        PathPrefix(`/health`) || PathPrefix(`/docs`) || PathPrefix(`/openapi.json`))
      - traefik.http.routers.fmis-api.entrypoints=${TRAEFIK_ENTRYPOINT:-web}
      - traefik.http.routers.fmis-api.tls=${TRAEFIK_TLS:-false}
      - traefik.http.routers.fmis-api.priority=10
      # Einziger Backend-Pfad MIT ForwardAuth: /auth/sso lebt davon, dass der
      # Kopf Remote-Email vom Portal stammt und nicht vom Anrufer. Eigener
      # Router, weil der API-Router oben bewusst ohne Middleware läuft — und
      # mit höherer Priorität als dessen 10, sonst gewinnt der und der Schutz
      # fiele lautlos weg. Path (exakt), nicht PathPrefix.
      - >-
        traefik.http.routers.fmis-sso.rule=Host(`${DOMAIN:-fmis.riedackerhof.ch}`) &&
        Path(`/auth/sso`)
      - traefik.http.routers.fmis-sso.middlewares=${TRAEFIK_MIDDLEWARES:-authelia-chain@file}
      - traefik.http.routers.fmis-sso.entrypoints=${TRAEFIK_ENTRYPOINT:-web}
      - traefik.http.routers.fmis-sso.tls=${TRAEFIK_TLS:-false}
      - traefik.http.routers.fmis-sso.priority=20
      - traefik.http.routers.fmis-sso.service=fmis-api
      - traefik.http.services.fmis-api.loadbalancer.server.port=8000

  frontend:
    restart: unless-stopped
    build:
      # Repo-Root (nicht ./frontend!) — das Frontend braucht core/frontend/src
      # und modules/*/frontend/src + schema/*.sql, die ausserhalb von
      # frontend/ liegen. Siehe frontend/Dockerfile.
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ""
    networks:
      - web-netzwerk
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-web-netzwerk}
      - traefik.http.routers.fmis-app.rule=Host(`${DOMAIN:-fmis.riedackerhof.ch}`)
      # Authelia-ForwardAuth vor der Oberflaeche, wo es das gibt (Server).
      # Wo nicht (lokal): TRAEFIK_MIDDLEWARES=fmis-noop@docker in .env — der
      # Router braucht eine Middleware, die wirklich existiert, sonst
      # deaktiviert Traefik ihn ("middleware does not exist"), und ein leerer
      # Wert hilft nicht: ${VAR:-default} greift auch bei leerer Variable.
      # Der API-Router bleibt bewusst ohne ForwardAuth — Sync, Lesegeraet und
      # der Offline-Betrieb haengen am Bearer-Token, nicht an einem Cookie.
      - traefik.http.routers.fmis-app.middlewares=${TRAEFIK_MIDDLEWARES:-authelia-chain@file}
      - traefik.http.middlewares.fmis-noop.headers.customResponseHeaders.X-Fmis-Auth=none
      - traefik.http.routers.fmis-app.entrypoints=${TRAEFIK_ENTRYPOINT:-web}
      - traefik.http.routers.fmis-app.tls=${TRAEFIK_TLS:-false}
      - traefik.http.routers.fmis-app.priority=1
      - traefik.http.services.fmis-app.loadbalancer.server.port=80

networks:
  # Externes Traefik-Netz. Auf dem Server heisst es `web-netzwerk` (Traefik
  # ohne TLS, Entrypoint `web` — TLS terminiert Nginx Proxy Manager davor),
  # lokal `webproxy` (~/git/dev-traefik-localhost, Entrypoint `websecure`
  # mit mkcert-TLS) — via TRAEFIK_NETWORK / TRAEFIK_ENTRYPOINT / TRAEFIK_TLS
  # in .env umschaltbar, der Service-Alias `web-netzwerk` bleibt gleich.
  web-netzwerk:
    external: true
    name: ${TRAEFIK_NETWORK:-web-netzwerk}

volumes:
  postgres_data:
