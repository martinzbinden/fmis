services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fmis
      POSTGRES_PASSWORD: fmis
      POSTGRES_DB: fmis
    # Kein ports-Mapping: nur intern (im Docker-Netz) für den Backend-Container erreichbar.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fmis"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://fmis:fmis@postgres:5432/fmis
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET muss in .env gesetzt sein}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-365}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:?INITIAL_ADMIN_EMAIL muss in .env gesetzt sein}
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL muss in .env gesetzt sein, z.B. https://fmis.riedackerhof.ch}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:-fmis@localhost}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      # NUR für Test-/Entwicklungsumgebungen setzen — leer lassen in Produktion!
      # Aktiviert POST /auth/password-login (Admin-Login ohne Magic-Link).
      TEST_LOGIN_PASSWORD: ${TEST_LOGIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - web-netzwerk
    labels:
      - traefik.enable=true
      - traefik.docker.network=web-netzwerk
      # Ein Backend/eine DB für ALLE Module (siehe core/backend/fmis_core) —
      # /<modul>/sync/* je aktiviertem Modul (backend/app/main.py), plus die
      # geteilten Core-Routen. Höhere Priorität als der Frontend-Router unten,
      # sonst würde z.B. /livestock/sync/push vom SPA-Catch-all verschluckt,
      # obwohl /livestock selbst (ohne /sync) eine Frontend-Route ist.
      - >-
        traefik.http.routers.fmis-api.rule=Host(`${DOMAIN:-fmis.riedackerhof.ch}`) &&
        (PathPrefix(`/auth`) || PathPrefix(`/core`) || PathPrefix(`/admin`) ||
        PathPrefix(`/livestock/sync`) || PathPrefix(`/dairy/sync`) || PathPrefix(`/fields/sync`) ||
        PathPrefix(`/health`) || PathPrefix(`/docs`) || PathPrefix(`/openapi.json`))
      - traefik.http.routers.fmis-api.entrypoints=web
      - traefik.http.routers.fmis-api.priority=10
      - traefik.http.services.fmis-api.loadbalancer.server.port=8000

  frontend:
    build:
      # Repo-Root (nicht ./frontend!) — das Frontend braucht core/frontend/src
      # und modules/*/frontend/src + schema/*.sql, die ausserhalb von
      # frontend/ liegen. Siehe frontend/Dockerfile.
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ""
    networks:
      - web-netzwerk
    labels:
      - traefik.enable=true
      - traefik.docker.network=web-netzwerk
      - traefik.http.routers.fmis-app.rule=Host(`${DOMAIN:-fmis.riedackerhof.ch}`)
      - traefik.http.routers.fmis-app.entrypoints=web
      - traefik.http.routers.fmis-app.priority=1
      - traefik.http.services.fmis-app.loadbalancer.server.port=80

networks:
  web-netzwerk:
    external: true

volumes:
  postgres_data:
