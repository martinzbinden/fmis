server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Service Worker darf nie gecacht werden, sonst propagieren App-Updates nicht.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # nginx' eingebaute mime.types kennt .mjs und .webmanifest nicht (nur
    # .wasm wurde nachträglich ergänzt) — ohne das lehnen Browser .mjs strikt
    # als Modul-Script ab ("non-JavaScript MIME type application/octet-stream").
    # default_type NUR in diesem location-Scope setzen, nicht per types{} im
    # server-Block überschreiben — das hatte im Mastplaner-Modul letztes Mal
    # die globale Zuordnung für ALLE Dateitypen (auch .html/.js) kaputtgemacht.
    location ~ \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    location ~ \.webmanifest$ {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Client-seitiges Routing (react-router): alles Unbekannte auf index.html.
    location / {
        try_files $uri /index.html;
    }
}
