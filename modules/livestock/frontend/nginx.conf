server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Falls die installierte nginx-Version application/wasm noch nicht kennt.
    types {
        application/wasm wasm;
    }

    # Service Worker darf nie gecacht werden, sonst propagieren App-Updates nicht.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Client-seitiges Routing (react-router): alles Unbekannte auf index.html.
    location / {
        try_files $uri /index.html;
    }
}
