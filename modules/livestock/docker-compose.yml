services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mastplaner
      POSTGRES_PASSWORD: mastplaner
      POSTGRES_DB: mastplaner
    # Kein ports-Mapping: nur intern (im Docker-Netz) für den Backend-Container erreichbar.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mastplaner"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://mastplaner:mastplaner@postgres:5432/mastplaner
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET muss in .env gesetzt sein}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-365}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:?INITIAL_ADMIN_EMAIL muss in .env gesetzt sein}
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL muss in .env gesetzt sein, z.B. https://fmis.riedackerhof.ch}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:-mastplaner@localhost}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SCHEMA_DIR: /schema
      AUTH_SCHEMA_DIR: /auth-schema
    volumes:
      - ./schema:/schema:ro
      - ./backend/schema:/auth-schema:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - web-netzwerk
    labels:
      - traefik.enable=true
      - traefik.docker.network=web-netzwerk
      - >-
        traefik.http.routers.livestock-api.rule=Host(`${DOMAIN:-fmis.riedackerhof.ch}`) &&
        (PathPrefix(`/auth`) || PathPrefix(`/sync`) || PathPrefix(`/health`) ||
        PathPrefix(`/docs`) || PathPrefix(`/openapi.json`))
      - traefik.http.routers.livestock-api.entrypoints=web
      - traefik.http.routers.livestock-api.priority=10
      - traefik.http.services.livestock-api.loadbalancer.server.port=8000

  frontend:
    build:
      # Modul-Root (nicht ./frontend!) — das Frontend braucht schema/*.sql
      # zur Build-Zeit, das liegt ausserhalb von frontend/. Siehe frontend/Dockerfile.
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ""
    networks:
      - web-netzwerk
    labels:
      - traefik.enable=true
      - traefik.docker.network=web-netzwerk
      - traefik.http.routers.livestock-app.rule=Host(`${DOMAIN:-fmis.riedackerhof.ch}`)
      - traefik.http.routers.livestock-app.entrypoints=web
      - traefik.http.routers.livestock-app.priority=1
      - traefik.http.services.livestock-app.loadbalancer.server.port=80

networks:
  web-netzwerk:
    external: true

volumes:
  postgres_data:
