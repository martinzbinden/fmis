services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fields
      POSTGRES_PASSWORD: fields
      POSTGRES_DB: fields
    # Kein ports-Mapping: nur intern (im Docker-Netz) für den Backend-Container erreichbar.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fields"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://fields:fields@postgres:5432/fields
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET muss in .env gesetzt sein}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-365}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:?INITIAL_ADMIN_EMAIL muss in .env gesetzt sein}
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL muss in .env gesetzt sein, z.B. https://felder-wyden.ch}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:-fields@localhost}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      # NUR für Test-/Entwicklungsumgebungen setzen — leer lassen in Produktion!
      # Aktiviert POST /auth/password-login (Admin-Login ohne Magic-Link).
      TEST_LOGIN_PASSWORD: ${TEST_LOGIN_PASSWORD:-}
      SCHEMA_DIR: /schema
      AUTH_SCHEMA_DIR: /auth-schema
    volumes:
      - ./schema:/schema:ro
      - ./backend/schema:/auth-schema:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - web-netzwerk
    labels:
      - traefik.enable=true
      - traefik.docker.network=web-netzwerk
      # EIN Backend/EINE DB für beide Betriebe (Betriebszweiggemeinschaft/
      # ÖLN-Gemeinschaft, gemeinsame Datenhaltung/Karte) — daher zwei Host-
      # Regeln per `||` statt zwei separate Router. PUBLIC_URL (für den
      # Magic-Link-Mailtext) referenziert nur eine der beiden Domains; das
      # Login selbst ist trotzdem pro Domain separat (siehe README: Browser-
      # Storage ist origin-gebunden, ein Login gilt nicht automatisch für
      # beide Domains gleichzeitig).
      - >-
        traefik.http.routers.fields-api.rule=(Host(`${DOMAIN_1:-felder-wyden.ch}`) ||
        Host(`${DOMAIN_2:-felder-riedacker.ch}`)) &&
        (PathPrefix(`/auth`) || PathPrefix(`/sync`) || PathPrefix(`/admin`) ||
        PathPrefix(`/health`) || PathPrefix(`/docs`) || PathPrefix(`/openapi.json`))
      - traefik.http.routers.fields-api.entrypoints=web
      - traefik.http.routers.fields-api.priority=10
      - traefik.http.services.fields-api.loadbalancer.server.port=8000

  frontend:
    build:
      # Modul-Root (nicht ./frontend!) — das Frontend braucht schema/*.sql
      # zur Build-Zeit, das liegt ausserhalb von frontend/. Siehe frontend/Dockerfile.
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ""
    networks:
      - web-netzwerk
    labels:
      - traefik.enable=true
      - traefik.docker.network=web-netzwerk
      # Ein Frontend-Container, unter beiden Domains erreichbar (siehe
      # Backend-Router oben für die Begründung).
      - >-
        traefik.http.routers.fields-app.rule=Host(`${DOMAIN_1:-felder-wyden.ch}`) ||
        Host(`${DOMAIN_2:-felder-riedacker.ch}`)
      - traefik.http.routers.fields-app.entrypoints=web
      - traefik.http.routers.fields-app.priority=1
      - traefik.http.services.fields-app.loadbalancer.server.port=80

networks:
  web-netzwerk:
    external: true

volumes:
  postgres_data:
