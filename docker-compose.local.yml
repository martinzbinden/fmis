# Nur für lokales Testen OHNE Reverse-Proxy (nackte Ports). Nutzung:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
# web-netzwerk wird hier lokal erzeugt statt (wie in Produktion) extern erwartet.
# Bevorzugt ist inzwischen der lokale Traefik (~/git/dev-traefik-localhost):
# dann reicht `docker compose up --build -d` mit TRAEFIK_*/DOMAIN in .env
# (siehe .env.example), Ergebnis https://fmis.riedackerhof.localhost — und
# diese Override-Datei wird nicht gebraucht.
services:
  backend:
    ports:
      - "8000:8000"

  frontend:
    # Ohne Traefik ist Frontend (8080) nicht same-origin mit Backend (8000) —
    # relative Pfade (Produktions-Default) würden ins Leere laufen.
    build:
      args:
        VITE_API_URL: "http://localhost:8000"
    ports:
      - "8080:80"

  postgres:
    ports:
      - "5433:5432"

networks:
  web-netzwerk:
    external: false
